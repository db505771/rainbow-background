<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Solid Black Rainbow Framed Rectangle</title>
  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      overflow: hidden;
    }

    .rainbow-black-rectangle {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;

      /* Sharp rectangular edges */
      border-radius: 0px;
      overflow: hidden;

      /* Solid black background */
      background-color: #000000;

      /* Non-interactive element setup */
      pointer-events: none;
      user-select: none;
    }

    /* Top & Bottom Rainbow Lines (Horizontal) */
    .rainbow-black-rectangle::before,
    .rainbow-black-rectangle::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 2px; /* Thickness of top/bottom lines */
      background: linear-gradient(
        90deg, 
        #ff0000 0%, 
        #ff7f00 14%, 
        #ffff00 28%, 
        #00ff00 42%, 
        #00ffff 57%, 
        #0000ff 71%, 
        #8b00ff 85%, 
        #ff00ff 100%
      );
      z-index: 2;
    }

    .rainbow-black-rectangle::before { top: 0; }
    .rainbow-black-rectangle::after { bottom: 0; }

    /* Left & Right Rainbow Lines (Vertical) */
    .rainbow-side-left,
    .rainbow-side-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px; /* Thickness of side lines */
      z-index: 2;
    }

    .rainbow-side-left {
      left: 0;
      background: linear-gradient(
        180deg, 
        #ff0000 0%, 
        #ff7f00 14%, 
        #ffff00 28%, 
        #00ff00 42%, 
        #00ffff 57%, 
        #0000ff 71%, 
        #8b00ff 85%, 
        #ff00ff 100%
      );
    }

    .rainbow-side-right {
      right: 0;
      background: linear-gradient(
        180deg, 
        #ff0000 0%, 
        #ff7f00 14%, 
        #ffff00 28%, 
        #00ff00 42%, 
        #00ffff 57%, 
        #0000ff 71%, 
        #8b00ff 85%, 
        #ff00ff 100%
      );
    }
  </style>
</head>
<body>

  <!-- Non-button rectangular container framed on all 4 sides -->
  <div class="rainbow-black-rectangle">
    <div class="rainbow-side-left"></div>
    <div class="rainbow-side-right"></div>
    <!-- Place any static content here -->
  </div>

</body>
</html>
